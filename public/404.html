<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — CrewX</title>
    <meta name="theme-color" content="#07070b" />
    <link rel="icon" href="/images/logo.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        background: #07070b;
        color: #f3f3f7;
        font-family: "Inter", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }
      .noise {
        pointer-events: none;
        position: fixed;
        inset: 0;
        z-index: 5;
        opacity: 0.05;
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      }
      .grid {
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(rgba(239, 68, 68, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(239, 68, 68, 0.05) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(ellipse at center, black 20%, transparent 72%);
      }
      .orb {
        position: fixed;
        width: 420px;
        height: 420px;
        border-radius: 9999px;
        background: rgba(239, 68, 68, 0.22);
        filter: blur(90px);
        animation: pulse 7s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.15);
          opacity: 1;
        }
      }
      main {
        position: relative;
        z-index: 10;
        text-align: center;
        padding: 24px;
      }
      .code {
        display: block;
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: clamp(96px, 24vw, 220px);
        line-height: 0.95;
        letter-spacing: -0.04em;
        color: #ef4444;
        text-shadow: 0 0 60px rgba(239, 68, 68, 0.45);
        animation: flicker 4s linear infinite;
      }
      @keyframes flicker {
        0%, 100% { opacity: 1; }
        92% { opacity: 1; }
        93% { opacity: 0.55; }
        94% { opacity: 1; }
        96% { opacity: 0.7; }
        97% { opacity: 1; }
      }
      h1 {
        margin-top: 18px;
        font-family: "Syne", sans-serif;
        font-weight: 700;
        font-size: clamp(22px, 4vw, 34px);
        letter-spacing: -0.02em;
      }
      p {
        margin-top: 10px;
        color: #8b8b9c;
        font-size: 14px;
      }
      .home {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 32px;
        padding: 14px 28px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        transition: all 0.25s ease;
      }
      .home:hover {
        background: #ef4444;
        border-color: #ef4444;
        color: #07070b;
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="noise"></div>
    <div class="grid"></div>
    <div class="orb"></div>
    <main>
      <span class="code">404</span>
      <h1>page not found.</h1>
      <p>this page does not exist or has been moved.</p>
      <a class="home" href="/">&larr;&nbsp;back to home</a>
    </main>
  </body>
</html>
